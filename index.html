<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memoriae ex Machina</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #fff;
  color: #000;
  font-family: 'Courier New', Courier, monospace;
  font-size: 20px;
  line-height: 1.65;
  overflow: hidden;
  cursor: none;
}

#terminal {
  height: 100vh;
  overflow-y: scroll;
  padding: 32px 40px 48px;
  scrollbar-width: none;
}
#terminal::-webkit-scrollbar { display: none; }

.line {
  display: grid;
  grid-template-columns: 10ch 14ch 1fr;
  padding: 0;
}

.l-time { color: #bbb; }
.l-op   { }
.l-det  { color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.c-scan  { color: #999; }
.c-det   { color: #444; }
.c-arch  { color: #444; }
.c-save  { color: #000; font-weight: bold; }
.c-lost  { color: #bbb; }
.c-part  { color: #666; }
.c-muted { color: #ccc; }

.l-content {
  padding-left: 24ch;
  font-style: italic;
  color: #333;
}

.l-prog {
  padding-left: 10ch;
  color: #555;
}
.l-prog.failed { color: #ccc; }

.l-gap { height: 12px; }

.l-stat {
  padding-left: 10ch;
  color: #777;
  line-height: 1.55;
}
.l-stat-sep {
  padding-left: 10ch;
  color: #999;
  line-height: 1.55;
}

html.dark, html.dark body {
  background: #000;
  color: #ccc;
}
html.dark .l-time          { color: #444; }
html.dark .c-scan          { color: #555; }
html.dark .c-det           { color: #999; }
html.dark .c-arch          { color: #999; }
html.dark .c-save          { color: #fff; }
html.dark .c-lost          { color: #3a3a3a; }
html.dark .c-part          { color: #777; }
html.dark .c-muted         { color: #2a2a2a; }
html.dark .l-det           { color: #666; }
html.dark .l-content       { color: #888; }
html.dark .l-prog          { color: #666; }
html.dark .l-prog.failed   { color: #2a2a2a; }
html.dark .l-stat          { color: #555; }
html.dark .l-stat-sep      { color: #444; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="fragments.js"></script>
<script>
// ── utils ─────────────────────────────────────────────────────────────────────

const pad  = n => String(n).padStart(2, '0');
const ts   = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const rand = (a, b) => a + Math.random() * (b - a);
const ri   = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmtId   = n => `MEM_${String(n).padStart(4, '0')}`;
const fmtSize = b => b < 1024 ? `${b} B` : b < 1048576 ? `${(b/1024).toFixed(1)} kB` : `${(b/1048576).toFixed(2)} MB`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const BAR_WIDTH = 24;

// ── i18n ──────────────────────────────────────────────────────────────────────

const LANG = {
  en: {
    op_scan:   'REMEMBRANCE',  op_miss:  '—',
    op_found:  'FOUND',        op_arch:  'ARCHIVING',
    op_saved:  'SAVED',        op_lost:  'LOST',   op_part: 'PARTIAL',
    scan:      id          => `${id} — trying to recall memory`,
    miss:      id          => `${id} — nothing to recall`,
    found:     (t, src, c) => `${t} / ${src} — confidence: ${c}`,
    saved:     (id, sz)    => `${id} — ${sz} written to corpus`,
    lost:      (id, r)     => `${id} — ${r}`,
    part:      (id, p, sz) => `${id} — ${p} of ${sz} recovered`,
    lost_msgs: ['entropy threshold exceeded', 'slipped away', 'faded away'],
    write_err: 'write error',
    types:     { personal_memory: 'personal memory', internet_artifact: 'internet artifact', cultural_artifact: 'cultural artifact', data_fragment: 'data fragment' },
    s_arch:    'archived',   s_lost:    'lost',      s_part:  'partial',
    s_miss:    'not detected',
    s_entr:    'entropy',    s_up:      'uptime',    s_since: 'since',
  },
  hu: {
    op_scan:   'EMLÉKEZÉS',    op_miss:  '—',
    op_found:  'AZONOSÍTVA',   op_arch:  'ARCHIVÁLÁS',
    op_saved:  'MENTVE',       op_lost:  'ELVESZETT', op_part: 'RÉSZLEGES',
    scan:      id          => `${id} — próbál emlékezni`,
    miss:      id          => `${id} — nem található emlék`,
    found:     (t, src, c) => `${t} / ${src} — bizonyosság: ${c}`,
    saved:     (id, sz)    => `${id} — ${sz} kiírva`,
    lost:      (id, r)     => `${id} — ${r}`,
    part:      (id, p, sz) => `${id} — ${p} helyreállítva / ${sz}`,
    lost_msgs: ['entrópia-küszöb túllépve', 'elillant', 'elhalványult'],
    write_err: 'írási hiba',
    types:     { personal_memory: 'személyes emlék', internet_artifact: 'online tartalom', cultural_artifact: 'kulturális tartalom', data_fragment: 'adattöredék' },
    s_arch:    'archivált',  s_lost:    'elveszett', s_part:  'részleges',
    s_miss:    'nem található',
    s_entr:    'entrópia',   s_up:      'futásidő',  s_since: 'óta',
  },
};

let lang = 'en';
const L = () => LANG[lang];

function makeBar(pct, failed) {
  const filled = Math.round(pct / 100 * BAR_WIDTH);
  const bar = '▓'.repeat(filled) + '░'.repeat(BAR_WIDTH - filled);
  const pctStr = String(Math.round(pct)).padStart(3) + '%';
  return `[${bar}]  ${pctStr}${failed ? '  ' + L().write_err : ''}`;
}

// ── DOM helpers ───────────────────────────────────────────────────────────────

const $t = document.getElementById('terminal');
let counter    = 0;
let nSaved     = 0;
let nLost      = 0;
let nPartial   = 0;
let nMissed    = 0;
let entropy    = 0.312;
let cycleCount = 0;
const sessionStart = Date.now();

function scroll() { $t.scrollTop = $t.scrollHeight; }

function trim() {
  while ($t.children.length > 600) $t.removeChild($t.firstChild);
}

function addLine(time, op, detail, cls) {
  const el = document.createElement('div');
  el.className = 'line';
  el.innerHTML =
    `<span class="l-time">${esc(time)}</span>` +
    `<span class="l-op c-${cls}">${esc(op)}</span>` +
    `<span class="l-det">${esc(detail)}</span>`;
  $t.appendChild(el);
  trim();
  scroll();
}

function addContentLine(text) {
  const el = document.createElement('div');
  el.className = 'l-content';
  el.textContent = text;
  $t.appendChild(el);
  scroll();
}

function addGap() {
  const el = document.createElement('div');
  el.className = 'l-gap';
  $t.appendChild(el);
}

function addProgressLine() {
  const el = document.createElement('div');
  el.className = 'l-prog';
  el.textContent = makeBar(0, false);
  $t.appendChild(el);
  scroll();
  return el;
}

function addStat(text) {
  const el = document.createElement('div');
  el.className = 'l-stat';
  el.textContent = text;
  $t.appendChild(el);
  scroll();
}

function addStatSep(text) {
  const el = document.createElement('div');
  el.className = 'l-stat-sep';
  el.textContent = text;
  $t.appendChild(el);
  scroll();
}

function logStats() {
  const total  = nSaved + nLost + nPartial;
  const pct    = n => total > 0 ? (n / total * 100).toFixed(1) + '%' : '—';
  const e      = Math.floor((Date.now() - sessionStart) / 1000);
  const uptime = `${pad(Math.floor(e/3600))}:${pad(Math.floor(e%3600/60))}:${pad(e%60)}`;
  const since  = new Date(sessionStart).toTimeString().slice(0,8);

  const sep = '─'.repeat(52);
  const row = (label, val, extra = '') => {
    const base = `   ${label.padEnd(16)}${String(val).padStart(8)}`;
    return extra ? `${base}   ·   ${extra}` : base;
  };

  addGap();
  addStatSep(sep);
  addStat(row(L().s_arch, nSaved,   pct(nSaved)));
  addStat(row(L().s_lost, nLost,    pct(nLost)));
  addStat(row(L().s_part, nPartial, pct(nPartial)));
  addStat(row(L().s_miss, nMissed));
  addStatSep(sep);
  addStat(row(L().s_entr, entropy.toFixed(3)));
  addStat(row(L().s_up,   uptime,   `${L().s_since}   ${since}`));
  addStatSep(sep);
  addGap();
}

function updateProgress(el, pct, failed) {
  el.textContent = makeBar(pct, failed);
  if (failed) el.classList.add('failed');
  scroll();
}

// ── cycle ─────────────────────────────────────────────────────────────────────

function cycle() {
  const frag    = pick(POOL);
  const id      = fmtId(++counter);
  const conf    = rand(0.52, 0.98);
  const size    = ri(512, 9216);
  const roll    = Math.random();
  const outcome = roll < 0.80 ? 'saved' : roll < 0.93 ? 'lost' : 'partial';

  addLine(ts(), L().op_scan, L().scan(id), 'scan');

  setTimeout(() => {

    if (Math.random() < 0.08) {
      addLine(ts(), L().op_miss, L().miss(id), 'muted');
      nMissed++;
      cycleCount++;
      if (cycleCount % 50 === 0) logStats();
      addGap();
      return setTimeout(cycle, ri(2000, 5000));
    }

    addLine(ts(), L().op_found, L().found(L().types[frag.type], frag.source, conf.toFixed(2)), 'det');
    const _t = lang === 'hu' && frag.hu !== undefined ? frag.hu : frag.text;
    addContentLine(typeof _t === 'function' ? _t() : _t);

    setTimeout(() => {
      const d   = new Date();
      const path = `/corpus/${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}/${id}`;
      addLine(ts(), L().op_arch, `${id} → ${path}`, 'arch');

      const progEl   = addProgressLine();
      const duration = ri(2800, 6500);
      const start    = Date.now();
      const failAt   = outcome === 'lost' ? rand(48, 82) : 101;

      const timer = setInterval(() => {
        const pct = Math.min(100, (Date.now() - start) / duration * 100);

        if (outcome === 'lost' && pct >= failAt) {
          clearInterval(timer);
          updateProgress(progEl, pct, true);
          addLine(ts(), L().op_lost, L().lost(id, pick(L().lost_msgs)), 'lost');
          nLost++;
          entropy = Math.min(0.99, entropy + rand(0.004, 0.010));
          cycleCount++;
          if (cycleCount % 50 === 0) logStats();
          addGap();
          return setTimeout(cycle, ri(2000, 5000));
        }

        if (pct >= 100) {
          clearInterval(timer);
          updateProgress(progEl, 100, false);
          if (outcome === 'partial') {
            const part = Math.floor(size * rand(0.30, 0.72));
            addLine(ts(), L().op_part, L().part(id, fmtSize(part), fmtSize(size)), 'part');
            nPartial++;
            entropy = Math.min(0.99, entropy + rand(0.001, 0.003));
          } else {
            addLine(ts(), L().op_saved, L().saved(id, fmtSize(size)), 'save');
            nSaved++;
            entropy = Math.max(0.01, entropy - rand(0.001, 0.005));
          }
          cycleCount++;
          if (cycleCount % 50 === 0) logStats();
          addGap();
          return setTimeout(cycle, ri(1500, 4000));
        }

        updateProgress(progEl, pct, false);
      }, 150);

    }, ri(400, 1000));
  }, ri(800, 2200));
}

setTimeout(cycle, 400);

document.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') document.documentElement.classList.toggle('dark');
  if (e.key === 'l' || e.key === 'L') lang = lang === 'en' ? 'hu' : 'en';
});
</script>
</body>
</html>
